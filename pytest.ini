
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v 
# -v verbose it tells pytest to automatically include the -v flag every single time you run tests 
# from the command line, without needing to type it out manually.
# More detailed output: pytest prints the full name of every test function along with its individual status (PASSED, FAILED, SKIPPED).
# Clearer failure reports: If a test fails, verbose mode provides a more explicit breakdown of what happened and where the failure occurred.
